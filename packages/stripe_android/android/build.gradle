group 'com.flutter.stripe'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.0'
    ext.stripe_version = '21.26.+'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.flutter.stripe'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        consumerProguardFiles 'proguard-rules.txt'
    }
}

dependencies {
    // ✅ Твоя объединённая Stripe SDK
    api("com.github.Agisight:stripe-android:lim-SNAPSHOT") {
        exclude group: "com.stripe", module: "financial-connections"
        exclude group: "com.stripe", module: "paymentsheet"
        exclude group: "com.stripe", module: "payments-core"
        exclude group: "com.stripe", module: "stripe-core"
    }

    // ✅ Остальные стандартные библиотеки
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.1"
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'

    // ✅ ViewBinding fix (AGP 8.1.x)
    implementation "androidx.viewbinding:viewbinding:8.1.0"

    // ✅ Для Google Pay (compileOnly)
    compileOnly "com.google.android.gms:play-services-wallet:19.3.0"
    compileOnly 'com.stripe:stripe-android-issuing-push-provisioning:1.1.0'
}

configurations.all {
    resolutionStrategy {
        force "com.github.Agisight:stripe-android:lim-SNAPSHOT"
        force "androidx.viewbinding:viewbinding:8.1.0"
    }
}

